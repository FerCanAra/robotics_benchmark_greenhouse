name: Docker image

# Builds the Docker image of the benchmark and publishes it in the GitHub
# Container Registry (ghcr.io/<owner>/robotics_benchmark_greenhouse).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mvsim_ref:
        description: MVSim tag, branch or commit (empty = the one in docker/Dockerfile)
        default: ''


permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: ${{ inputs.mvsim_ref && format('MVSIM_REF={0}', inputs.mvsim_ref) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
