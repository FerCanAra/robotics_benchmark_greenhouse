# Regulated Pure Pursuit (nav2_regulated_pure_pursuit_controller). Path follower (no
# predicted trajectory): SAE2 is computed w.r.t. the path it follows (/received_global_plan).
# Same limits as TEB (v <= 0.5 m/s, w <= 1.5 rad/s).   Used with:  controller:=rpp
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      # Lookahead 1.0 m (Nav2 default 0.6 m): with 0.6 m the pure pursuit loop, plus the
      # ~0.35 s yaw lag of the skid-steer platform, weaved +-0.35 m inside the aisle and
      # brushed the plants (0/6 successes with terrain in the pilot campaign).
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # In-place rotations disabled: on the skid-steer platform a rotation that starts
      # from standstill sticks until the wheel PID integrator builds up and then
      # overshoots (stick-slip); RPP got stuck or spun at every corner. Without it RPP
      # takes the corners as pure-pursuit arcs, slowed down by the curvature regulation.
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
