# Smac Planner 2D (A* on the 2D costmap, 8-connected, with smoother), Nav2 Humble.
# Used with:  planner:=smac
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 1.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 4.0   # higher: avoids the inflated (high-cost) cells near the plants
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
