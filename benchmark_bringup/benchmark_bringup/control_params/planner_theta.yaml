# Theta* (any-angle A*) global planner, Nav2 Humble.   Used with:  planner:=theta (default)
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      tolerance: 1.0
      how_many_corners: 8      # graph connectivity: only 4 or 8 are admissible
      w_euc_cost: 1.0
      w_traversal_cost: 5.0    # higher: avoids the inflated (high-cost) cells near the plants
      w_heuristic_cost: 1.0
      use_final_approach_orientation: false
